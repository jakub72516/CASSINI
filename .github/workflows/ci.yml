name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc13
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            flags: "-DCMAKE_BUILD_TYPE=Release"
          - name: ubuntu-clang17
            os: ubuntu-latest
            cc: clang-17
            cxx: clang++-17
            flags: "-DCMAKE_BUILD_TYPE=Release"
          - name: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
            flags: "-DCMAKE_BUILD_TYPE=Release"
          - name: windows-msvc
            os: windows-latest
            cc: cl
            cxx: cl
            flags: "-A x64"
          - name: ubuntu-asan-ubsan
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            flags: "-DCMAKE_BUILD_TYPE=Debug -DCASSINI_ENABLE_SANITIZERS=ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.flags }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
